<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Jojo Duntu, Design Engineer</title>
  <desc id="d">Animated banner. A design selection box draws around the name Jojo Duntu, a cursor labelled Design Engineer glides in, and a line cycles through Designing it, Building it and Shipping it.</desc>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#F7F5F0" opacity="0.10"/>
    </pattern>
  </defs>

  <style>
    .name { font: 800 84px 'Inter','SF Pro Display','Segoe UI',system-ui,sans-serif; fill: #F7F5F0; }
    .meta { font: 500 15px ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill: #8B8F98; }
    .chip { font: 600 13px 'Inter','Segoe UI',system-ui,sans-serif; fill: #0F1115; }
    .ph   { font: 500 28px ui-monospace,'SF Mono',Menlo,Consolas,monospace; fill: #E0A526; }
    .p1 { opacity: 1; }
    .p2, .p3 { opacity: 0; }

    .box { fill: none; stroke: #E0A526; stroke-width: 2;
           animation: draw 1.2s cubic-bezier(.65,0,.35,1) .3s backwards; }
    .hd  { fill: #0F1115; stroke: #E0A526; stroke-width: 2;
           transform-box: fill-box; transform-origin: center;
           animation: pop .35s ease-out 1.5s backwards; }
    .cur { animation: glide 1s cubic-bezier(.22,1,.36,1) .6s backwards; }
    .ph  { animation: cycle 9s infinite both; }
    .p1  { animation-delay: 1.8s; }
    .p2  { animation-delay: 4.8s; }
    .p3  { animation-delay: 7.8s; }

    @keyframes draw  { from { stroke-dasharray: 1300; stroke-dashoffset: 1300; }
                       to   { stroke-dasharray: 1300; stroke-dashoffset: 0; } }
    @keyframes pop   { from { opacity: 0; transform: scale(.4); } }
    @keyframes glide { from { opacity: 0; transform: translate(240px,70px); } }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(10px); }
      4%   { opacity: 1; transform: translateY(0); }
      30%  { opacity: 1; transform: translateY(0); }
      34%  { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 0; transform: translateY(-10px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .box, .hd, .cur, .ph { animation: none; }
      .p1 { opacity: 1; }
      .p2, .p3 { opacity: 0; }
    }
  </style>

  <!-- canvas -->
  <rect width="900" height="280" rx="20" fill="#0F1115"/>
  <rect width="900" height="280" rx="20" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="899" height="279" rx="19.5" fill="none" stroke="#2A2E37"/>

  <text class="meta" x="66" y="48">@jojoduntu</text>

  <!-- name -->
  <text class="name" x="82" y="152" textLength="470" lengthAdjust="spacingAndGlyphs">Jojo Duntu</text>

  <!-- selection box with handles -->
  <rect class="box" x="62" y="70" width="510" height="108"/>
  <rect class="hd" x="57" y="65"  width="10" height="10"/>
  <rect class="hd" x="567" y="65" width="10" height="10"/>
  <rect class="hd" x="57" y="173" width="10" height="10"/>
  <rect class="hd" x="567" y="173" width="10" height="10"/>

  <!-- cursor with role label -->
  <g transform="translate(576 182)">
    <g class="cur">
      <path d="M0 0 L0 17 L4.6 12.6 L8 20 L10.8 18.8 L7.4 11.4 L13.5 11.4 Z" fill="#E0A526" stroke="#0F1115" stroke-width="1.2" stroke-linejoin="round"/>
      <rect x="14" y="16" width="136" height="26" rx="7" fill="#E0A526"/>
      <text class="chip" x="26" y="34">Design Engineer</text>
    </g>
  </g>

  <!-- rotating line -->
  <text class="ph p1" x="82" y="240">Designing it.</text>
  <text class="ph p2" x="82" y="240">Building it.</text>
  <text class="ph p3" x="82" y="240">Shipping it.</text>
</svg>
